<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 날씨 | Weather Forecast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient-clear-day: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #6dd5ed 100%);
      --bg-gradient-clear-night: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
      --bg-gradient-rain: linear-gradient(135deg, #373b44 0%, #4286f4 100%);
      --bg-gradient-clouds: linear-gradient(135deg, #3a6073 0%, #3a7bd5 100%);
      --bg-gradient-snow: linear-gradient(135deg, #83a4d4 0%, #b6fbff 100%);
      
      --card-bg: rgba(255, 255, 255, 0.12);
      --card-border: rgba(255, 255, 255, 0.22);
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.75);
      --chip-bg: rgba(255, 255, 255, 0.15);
      --chip-active: rgba(255, 255, 255, 0.95);
      --chip-active-text: #1a2a44;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-gradient-clear-day);
      background-size: 200% 200%;
      animation: gradientShift 15s ease infinite;
      color: var(--text-primary);
      padding: 24px 16px;
      transition: background 1s ease;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 도시 선택 칩 */
    .city-nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .city-nav::-webkit-scrollbar {
      display: none;
    }

    .city-btn {
      padding: 8px 14px;
      border: 1px solid var(--card-border);
      background: var(--chip-bg);
      color: var(--text-primary);
      border-radius: 9999px;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      backdrop-filter: blur(10px);
      white-space: nowrap;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .city-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }

    .city-btn.active {
      background: var(--chip-active);
      color: var(--chip-active-text);
      font-weight: 600;
      border-color: transparent;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
    }

    /* 메인 날씨 카드 */
    .weather-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 28px;
      padding: 32px 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .weather-card::before {
      content: '';
      position: absolute;
      top: -50px;
      right: -50px;
      width: 160px;
      height: 160px;
      background: radial-gradient(circle, rgba(255,255,255,0.18) 0%, transparent 70%);
      pointer-events: none;
    }

    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .location-info h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .location-info p {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .refresh-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid var(--card-border);
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .refresh-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: rotate(90deg);
    }

    .refresh-btn.spinning svg {
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* 메인 날씨 비주얼 */
    .weather-visual {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 12px 0 24px 0;
    }

    .weather-icon-wrapper {
      width: 110px;
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,0.2));
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .temp-display {
      font-size: 4.5rem;
      font-weight: 700;
      line-height: 1;
      margin-top: 10px;
      letter-spacing: -2px;
      display: flex;
      align-items: flex-start;
    }

    .temp-unit {
      font-size: 2.2rem;
      font-weight: 400;
      margin-top: 6px;
      margin-left: 2px;
      opacity: 0.9;
    }

    .weather-status {
      font-size: 1.25rem;
      font-weight: 500;
      margin-top: 6px;
      color: #fff;
    }

    .temp-min-max {
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin-top: 6px;
    }

    /* 상세 지표 그리드 */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
      margin-top: 10px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
    }

    .metric-item {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 12px 8px;
      text-align: center;
      transition: background 0.2s;
    }

    .metric-item:hover {
      background: rgba(255, 255, 255, 0.14);
    }

    .metric-label {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .metric-value {
      font-size: 1rem;
      font-weight: 600;
    }

    /* 시간대별 예보 */
    .forecast-section {
      width: 100%;
      margin-top: 24px;
    }

    .forecast-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .forecast-list {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 6px;
      scrollbar-width: none;
    }
    .forecast-list::-webkit-scrollbar {
      display: none;
    }

    .forecast-item {
      flex: 0 0 auto;
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      min-width: 68px;
      transition: transform 0.2s;
    }

    .forecast-item:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.15);
    }

    .forecast-item.is-now {
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.4);
    }

    .forecast-time {
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .forecast-temp {
      font-size: 0.95rem;
      font-weight: 600;
    }

    /* 로딩 / 에러 상태 */
    .status-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 25, 45, 0.7);
      backdrop-filter: blur(8px);
      border-radius: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .status-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    .api-badge {
      text-align: center;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 4px;
    }
    .api-badge a {
      color: rgba(255, 255, 255, 0.85);
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 도시 선택 버튼 목록 -->
    <nav class="city-nav" id="cityNav" aria-label="도시 선택">
      <button class="city-btn active" data-name="서울" data-lat="37.5665" data-lon="126.9780">
        📍 서울
      </button>
      <button class="city-btn" data-name="부산" data-lat="35.1796" data-lon="129.0756">
        부산
      </button>
      <button class="city-btn" data-name="제주" data-lat="33.4996" data-lon="126.5312">
        제주
      </button>
      <button class="city-btn" data-name="인천" data-lat="37.4563" data-lon="126.7052">
        인천
      </button>
      <button class="city-btn" data-name="대구" data-lat="35.8714" data-lon="128.6014">
        대구
      </button>
      <button class="city-btn" data-name="대전" data-lat="36.3504" data-lon="127.3845">
        대전
      </button>
      <button class="city-btn" id="geoBtn">
        🛰️ 내 위치
      </button>
    </nav>

    <!-- 메인 날씨 카드 -->
    <main class="weather-card">
      <!-- 로딩 오버레이 -->
      <div class="status-overlay" id="statusOverlay">
        <div class="spinner"></div>
        <p id="statusMsg">날씨 정보를 가져오는 중...</p>
      </div>

      <!-- 상단 헤더 -->
      <div class="top-bar">
        <div class="location-info">
          <h1 id="cityName">서울특별시</h1>
          <p id="currentDate">로딩 중...</p>
        </div>
        <button class="refresh-btn" id="refreshBtn" title="새로고침" aria-label="새로고침">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
        </button>
      </div>

      <!-- 메인 비주얼 (아이콘 + 기온) -->
      <div class="weather-visual">
        <div class="weather-icon-wrapper" id="weatherIcon">
          <!-- 동적 날씨 아이콘 -->
        </div>
        <div class="temp-display">
          <span id="tempValue">--</span>
          <span class="temp-unit">°C</span>
        </div>
        <div class="weather-status" id="weatherStatus">날씨 상태</div>
        <div class="temp-min-max" id="tempMinMax">최저 --° / 최고 --°</div>
      </div>

      <!-- 세부 날씨 지표 -->
      <div class="metrics-grid">
        <div class="metric-item">
          <div class="metric-label">체감 온도</div>
          <div class="metric-value" id="apparentTemp">--°C</div>
        </div>
        <div class="metric-item">
          <div class="metric-label">습도</div>
          <div class="metric-value" id="humidity">--%</div>
        </div>
        <div class="metric-item">
          <div class="metric-label">풍속</div>
          <div class="metric-value" id="windSpeed">-- m/s</div>
        </div>
      </div>

      <!-- 시간대별 예보 (24시간) -->
      <div class="forecast-section">
        <div class="forecast-title">
          <span>🕒 오늘 시간대별 예보</span>
        </div>
        <div class="forecast-list" id="forecastList">
          <!-- 시간별 예보 아이템 자동 렌더링 -->
        </div>
      </div>
    </main>

    <!-- 오픈소스 API 출처 표시 -->
    <div class="api-badge">
      Data provided by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo API</a> (인증키 없이 동작)
    </div>
  </div>

  <script>
    // 상태 정의
    let currentCity = {
      name: "서울특별시",
      lat: 37.5665,
      lon: 126.9780
    };

    // WMO 날씨 코드 매핑표 (Open-Meteo 표준)
    const weatherCodes = {
      0: { label: "맑음", icon: "sun", bg: "clear" },
      1: { label: "대체로 맑음", icon: "sun-cloud", bg: "clear" },
      2: { label: "구름 조금", icon: "cloud-sun", bg: "clouds" },
      3: { label: "흐림", icon: "cloud", bg: "clouds" },
      45: { label: "안개", icon: "fog", bg: "clouds" },
      48: { label: "상에 안개", icon: "fog", bg: "clouds" },
      51: { label: "가벼운 이슬비", icon: "rain-light", bg: "rain" },
      53: { label: "이슬비", icon: "rain", bg: "rain" },
      55: { label: "짙은 이슬비", icon: "rain-heavy", bg: "rain" },
      61: { label: "약한 비", icon: "rain-light", bg: "rain" },
      63: { label: "비", icon: "rain", bg: "rain" },
      65: { label: "강한 비", icon: "rain-heavy", bg: "rain" },
      71: { label: "약한 눈", icon: "snow", bg: "snow" },
      73: { label: "눈", icon: "snow", bg: "snow" },
      75: { label: "폭설", icon: "snow-heavy", bg: "snow" },
      80: { label: "약한 소나기", icon: "rain-light", bg: "rain" },
      81: { label: "소나기", icon: "rain", bg: "rain" },
      82: { label: "강한 소나기", icon: "rain-heavy", bg: "rain" },
      95: { label: "뇌우", icon: "thunder", bg: "rain" },
      96: { label: "뇌우 및 우박", icon: "thunder", bg: "rain" },
      99: { label: "강한 뇌우 및 우박", icon: "thunder", bg: "rain" }
    };

    // 인라인 SVG 아이콘 생성기 (외부 리소스 의존 없이 독립 동작)
    function getSvgIcon(iconType, isDay = 1, size = 64) {
      const yellow = "#FFD166";
      const blue = "#4CC9F0";
      const white = "#F8F9FA";
      const gray = "#ADB5BD";

      switch (iconType) {
        case "sun":
          if (!isDay) {
            return `<svg width="${size}" height="${size}" viewBox="0 0 64 64">
              <path d="M42 32A18 18 0 1 1 23 16a20 20 0 0 0 19 16z" fill="#F1C40F" />
            </svg>`;
          }
          return `<svg width="${size}" height="${size}" viewBox="0 0 64 64">
            <circle cx="32" cy="32" r="14" fill="${yellow}" />
            <g stroke="${yellow}" stroke-width="3" stroke-linecap="round">
              <line x1="32" y1="6" x2="32" y2="12" />
              <line x1="32" y1="52" x2="32" y2="58" />
              <line x1="6" y1="32" x2="12" y2="32" />
              <line x1="52" y1="32" x2="58" y2="32" />
              <line x1="14" y1="14" x2="18" y2="18" />
              <line x1="46" y1="46" x2="50" y2="50" />
              <line x1="14" y1="50" x2="18" y2="46" />
              <line x1="46" y1="18" x2="50" y2="14" />
            </g>
          </svg>`;

        case "sun-cloud":
        case "cloud-sun":
          return `<svg width="${size}" height="${size}" viewBox="0 0 64 64">
            <circle cx="26" cy="24" r="10" fill="${yellow}" />
            <path d="M22 46h24a10 10 0 0 0 1-19.9 14 14 0 0 0-26.6 4A9 9 0 0 0 22 46z" fill="${white}" opacity="0.95"/>
          </svg>`;

        case "cloud":
        case "fog":
          return `<svg width="${size}" height="${size}" viewBox="0 0 64 64">
            <path d="M18 48h28a11 11 0 0 0 1.5-21.9 15 15 0 0 0-28.5 4.5A10 10 0 0 0 18 48z" fill="${white}"/>
          </svg>`;

        case "rain-light":
        case "rain":
          return `<svg width="${size}" height="${size}" viewBox="0 0 64 64">
            <path d="M18 40h28a11 11 0 0 0 1.5-21.9 15 15 0 0 0-28.5 4.5A10 10 0 0 0 18 40z" fill="${white}"/>
            <g stroke="${blue}" stroke-width="3" stroke-linecap="round">
              <line x1="24" y1="46" x2="20" y2="54" />
              <line x1="34" y1="46" x2="30" y2="54" />
              <line x1="44" y1="46" x2="40" y2="54" />
            </g>
          </svg>`;

        case "rain-heavy":
        case "thunder":
          return `<svg width="${size}" height="${size}" viewBox="0 0 64 64">
            <path d="M18 36h28a11 11 0 0 0 1.5-21.9 15 15 0 0 0-28.5 4.5A10 10 0 0 0 18 36z" fill="${gray}"/>
            <polygon points="32 40 25 50 31 50 29 58 39 46 33 46" fill="#F1C40F" />
          </svg>`;

        case "snow":
        case "snow-heavy":
          return `<svg width="${size}" height="${size}" viewBox="0 0 64 64">
            <path d="M18 40h28a11 11 0 0 0 1.5-21.9 15 15 0 0 0-28.5 4.5A10 10 0 0 0 18 40z" fill="${white}"/>
            <g fill="${white}">
              <circle cx="23" cy="49" r="2.5" />
              <circle cx="33" cy="51" r="2.5" />
              <circle cx="43" cy="49" r="2.5" />
            </g>
          </svg>`;

        default:
          return `<svg width="${size}" height="${size}" viewBox="0 0 64 64">
            <circle cx="32" cy="32" r="14" fill="${yellow}" />
          </svg>`;
      }
    }

    // 배경 테마 업데이트
    function updateBackground(category, isDay) {
      const root = document.documentElement;
      let bg = "var(--bg-gradient-clear-day)";

      if (!isDay) {
        bg = "var(--bg-gradient-clear-night)";
      } else if (category === "rain") {
        bg = "var(--bg-gradient-rain)";
      } else if (category === "clouds") {
        bg = "var(--bg-gradient-clouds)";
      } else if (category === "snow") {
        bg = "var(--bg-gradient-snow)";
      }

      document.body.style.background = bg;
    }

    // 날짜 포맷팅
    function updateDateTime() {
      const now = new Date();
      const options = { 
        year: 'numeric', 
        month: 'long', 
        day: 'numeric', 
        weekday: 'long' 
      };
      document.getElementById("currentDate").innerText = now.toLocaleDateString('ko-KR', options);
    }

    // 날씨 데이터 가져오기
    async function fetchWeather(lat, lon, cityName) {
      const overlay = document.getElementById("statusOverlay");
      const statusMsg = document.getElementById("statusMsg");
      const refreshBtn = document.getElementById("refreshBtn");

      overlay.classList.add("active");
      statusMsg.innerText = "날씨 정보를 불러오는 중...";
      refreshBtn.classList.add("spinning");

      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,wind_speed_10m&hourly=temperature_2m,weather_code,is_day&daily=temperature_2m_max,temperature_2m_min&timezone=auto`;

        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`API 요청 실패 (${response.status})`);
        }

        const data = await response.json();
        renderWeather(cityName, data);
      } catch (err) {
        console.error("날씨 정보 로드 실패:", err);
        statusMsg.innerText = "날씨 정보를 가져올 수 없습니다. 다시 시도해주세요.";
        setTimeout(() => {
          overlay.classList.remove("active");
        }, 1500);
      } finally {
        setTimeout(() => {
          overlay.classList.remove("active");
          refreshBtn.classList.remove("spinning");
        }, 300);
      }
    }

    // 화면 렌더링
    function renderWeather(name, data) {
      const current = data.current;
      const daily = data.daily;
      const hourly = data.hourly;

      // 도시 이름 및 헤더
      document.getElementById("cityName").innerText = name;

      // 현재 날씨 코드 해석
      const codeInfo = weatherCodes[current.weather_code] || { label: "맑음", icon: "sun", bg: "clear" };

      // 아이콘 및 배경 업데이트
      const iconContainer = document.getElementById("weatherIcon");
      iconContainer.innerHTML = getSvgIcon(codeInfo.icon, current.is_day, 100);
      updateBackground(codeInfo.bg, current.is_day);

      // 온도 및 상태
      document.getElementById("tempValue").innerText = Math.round(current.temperature_2m);
      document.getElementById("weatherStatus").innerText = codeInfo.label;

      // 최저 / 최고 기온
      if (daily && daily.temperature_2m_min && daily.temperature_2m_max) {
        const minTemp = Math.round(daily.temperature_2m_min[0]);
        const maxTemp = Math.round(daily.temperature_2m_max[0]);
        document.getElementById("tempMinMax").innerText = `최저 ${minTemp}° / 최고 ${maxTemp}°`;
      }

      // 세부 지표
      document.getElementById("apparentTemp").innerText = `${Math.round(current.apparent_temperature)}°C`;
      document.getElementById("humidity").innerText = `${current.relative_humidity_2m}%`;
      // km/h -> m/s 변환 (소수점 1자리)
      const windSpeedMs = (current.wind_speed_10m / 3.6).toFixed(1);
      document.getElementById("windSpeed").innerText = `${windSpeedMs} m/s`;

      // 시간별 예보 렌더링 (현재 시간부터 12시간)
      renderHourlyForecast(hourly);
    }

    // 시간대별 예보 렌더링
    function renderHourlyForecast(hourly) {
      const forecastList = document.getElementById("forecastList");
      forecastList.innerHTML = "";

      if (!hourly || !hourly.time) return;

      const currentHourStr = new Date().toISOString().slice(0, 13); // "YYYY-MM-DDTHH"
      let startIndex = hourly.time.findIndex(t => t.startsWith(currentHourStr));
      if (startIndex === -1) startIndex = 0;

      // 향후 12시간 표시
      const count = Math.min(12, hourly.time.length - startIndex);

      for (let i = 0; i < count; i++) {
        const idx = startIndex + i;
        const timeStr = hourly.time[idx];
        const dateObj = new Date(timeStr);
        const hour = dateObj.getHours();
        const displayTime = i === 0 ? "지금" : `${hour}시`;

        const temp = Math.round(hourly.temperature_2m[idx]);
        const wCode = hourly.weather_code[idx];
        const isDay = hourly.is_day ? hourly.is_day[idx] : 1;
        const info = weatherCodes[wCode] || { icon: "sun" };

        const item = document.createElement("div");
        item.className = `forecast-item ${i === 0 ? "is-now" : ""}`;
        item.innerHTML = `
          <div class="forecast-time">${displayTime}</div>
          <div class="forecast-icon">${getSvgIcon(info.icon, isDay, 28)}</div>
          <div class="forecast-temp">${temp}°</div>
        `;
        forecastList.appendChild(item);
      }
    }

    // 도시 탭 이벤트 바인딩
    document.querySelectorAll(".city-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        if (btn.id === "geoBtn") {
          getCurrentLocation();
          return;
        }

        document.querySelectorAll(".city-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");

        currentCity = {
          name: btn.dataset.name,
          lat: parseFloat(btn.dataset.lat),
          lon: parseFloat(btn.dataset.lon)
        };

        fetchWeather(currentCity.lat, currentCity.lon, currentCity.name);
      });
    });

    // 브라우저 Geolocation (내 위치 찾기)
    function getCurrentLocation() {
      if (!navigator.geolocation) {
        alert("현재 브라우저에서 위치 정보를 지원하지 않습니다.");
        return;
      }

      const geoBtn = document.getElementById("geoBtn");
      geoBtn.innerText = "🛰️ 찾는 중...";

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          document.querySelectorAll(".city-btn").forEach(b => b.classList.remove("active"));
          geoBtn.classList.add("active");
          geoBtn.innerText = "📍 현재 위치";

          currentCity = {
            name: "내 현재 위치",
            lat: position.coords.latitude,
            lon: position.coords.longitude
          };

          await fetchWeather(currentCity.lat, currentCity.lon, currentCity.name);
        },
        (error) => {
          console.warn("위치 정보 접근 실패:", error);
          alert("위치 정보를 가져올 수 없어 서울 날씨를 표시합니다.");
          geoBtn.innerText = "🛰️ 내 위치";
        },
        { timeout: 8000 }
      );
    }

    // 새로고침 버튼
    document.getElementById("refreshBtn").addEventListener("click", () => {
      fetchWeather(currentCity.lat, currentCity.lon, currentCity.name);
    });

    // 초기화 실행
    updateDateTime();
    fetchWeather(currentCity.lat, currentCity.lon, currentCity.name);
  </script>
</body>
</html>
